name: Release MSI

# Checks the parent repository (ggml-org/llama.cpp) for a newer release and, if
# one exists, builds and publishes a new LlamaCpp MSI release.
#
# Version rule: {Project-Version} = {Parent-Version}   (build tag, e.g. b6123)
# version.txt stores the parent build tag verbatim; it is used directly by
# installer\build.ps1 in download URLs and MSI filenames. The release tag on
# this repo matches the parent build tag.
#
# Triggers:
#   - schedule:            weekly, Friday 6:00 PM PST  (Saturday 02:00 UTC)
#   - workflow_dispatch:   manual run
#   - repository_dispatch: external event ("parent-release")

on:
  schedule:
    # Friday 6:00 PM PST == Saturday 02:00 UTC (PST is UTC-8; during PDT fires at 7 PM local)
    - cron: '0 2 * * 6'
  workflow_dispatch:
  repository_dispatch:
    types: [parent-release]

permissions:
  contents: write

env:
  PARENT_REPO: ggml-org/llama.cpp

jobs:
  check-upstream:
    name: Check parent repository for updates
    runs-on: windows-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      tag:        ${{ steps.check.outputs.tag }}
      binary_tag: ${{ steps.check.outputs.binary_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare parent release with current version
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Get the latest release tag (e.g., v0.6.0)
          $releaseTag = gh api "repos/$env:PARENT_REPO/releases/latest" --jq .tag_name
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') { throw "Unexpected parent release tag format: '$releaseTag'" }

          # Find the associated pre-release (binary build) for this release.
          # Binaries are in tags like b11429. We look for the most recent 'b' tag created around the same time as the release.
          $releases = gh api "repos/$env:PARENT_REPO/releases" --jq '.[] | {tag: .tag_name, created_at: .created_at}'
          $binaryTag = $releases | Where-Object { $_.tag -match '^b\d+$' } | Sort-Object created_at -Descending | Select-Object -First 1 -ExpandProperty tag

          if (-not $binaryTag) { throw "No associated nightly build (b\d+) found for release $releaseTag" }
          
          # We track the releaseTag as the version, but use the binaryTag for asset downloads
          $parentTag = $releaseTag
          "binary_tag=$binaryTag" | Out-File $env:GITHUB_OUTPUT -Append



          # version.txt stores the parent build tag verbatim ({Project-Version} = {Parent-Version})
          $current = (Get-Content installer/version.txt -Raw).Trim()   # e.g. b6119

          Write-Host "Parent release : $parentTag"
          Write-Host "Current version: $current"

          if ($parentTag -eq $current) {
            Write-Host "Up to date - no release needed."
            "has_update=false" | Out-File $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "New version    : $parentTag"
            "has_update=true"  | Out-File $env:GITHUB_OUTPUT -Append
            "tag=$parentTag"     | Out-File $env:GITHUB_OUTPUT -Append
            "binary_tag=$binaryTag" | Out-File $env:GITHUB_OUTPUT -Append
          }

  release:
    name: Build and release MSI
    needs: check-upstream
    if: needs.check-upstream.outputs.has_update == 'true'
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.check-upstream.outputs.tag }}
      BINARY_TAG: ${{ needs.check-upstream.outputs.binary_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup WiX toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Bump version.txt
        shell: pwsh
        run: |
          Set-Content -Path installer/version.txt -Value "$env:RELEASE_TAG" -NoNewline
          Set-Content -Path installer/nightly.txt -Value "$env:BINARY_TAG" -NoNewline

      - name: Build MSI
        shell: pwsh
        run: .\installer\build.ps1 -Variant both

      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installer/version.txt
          git commit -m "chore(release): bump version to $env:RELEASE_TAG [skip ci]"
          git push

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = Get-ChildItem -Recurse installer/output -Filter *.msi | ForEach-Object { $_.FullName }
          gh release create "$env:RELEASE_TAG" $assets `
            --title "LlamaCpp $env:RELEASE_TAG" `
            --notes "Automated release tracking parent ggml-org/llama.cpp release $env:RELEASE_TAG."
